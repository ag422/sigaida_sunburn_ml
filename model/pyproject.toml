[project]
name = "sunrisk"
version = "0.1.0"
description = "Wearable sunburn-risk model (awareness tool, not a medical device)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sunrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
