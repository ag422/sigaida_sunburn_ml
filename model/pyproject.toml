[project]
name = "sunrisk"
version = "0.1.0"
description = "Wearable sunburn-risk model (awareness tool, not a medical device)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
ml = ["scikit-learn>=1.3"]   # training only; inference is numpy (events/learned.py)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sunrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
